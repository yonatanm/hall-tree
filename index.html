<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cherry Wood Hall Tree — 3D (179cm)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1b20; }
  #app { width: 100%; height: 100%; }
  #hud {
    position: fixed; top: 14px; left: 16px; color: #cfcfd6;
    font: 13px/1.5 system-ui, sans-serif; pointer-events: none;
    background: rgba(0,0,0,.35); padding: 10px 14px; border-radius: 10px;
    backdrop-filter: blur(4px);
  }
  #hud b { color: #fff; }
  #variants {
    position: fixed; top: 14px; right: 16px; display: flex; gap: 8px;
    flex-direction: column; align-items: flex-end;
    font: 13px system-ui, sans-serif;
  }
  #views {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
    font: 13px system-ui, sans-serif; max-width: 96vw;
  }
  #variants button, #views button {
    color: #cfcfd6; background: rgba(0,0,0,.35); border: 1px solid #3a3a44;
    padding: 8px 12px; border-radius: 10px; cursor: pointer;
    backdrop-filter: blur(4px); font: inherit;
  }
  #variants button.on, #views button.on {
    color: #fff; border-color: #b0622d; background: rgba(176,98,45,.25);
  }
  #variantSel {
    display: none; position: fixed; top: 48px; left: 50%; transform: translateX(-50%);
    color: #fff; background: rgba(0,0,0,.55); border: 1px solid #b0622d;
    padding: 8px 12px; border-radius: 10px; font: 13px system-ui, sans-serif;
    max-width: 92vw;
  }
  #partsPanel {
    position: fixed; left: 16px; bottom: 70px; display: none;
    background: rgba(0,0,0,.55); border: 1px solid #3a3a44; border-radius: 10px;
    padding: 8px; font: 13px/1.3 system-ui, sans-serif; color: #cfcfd6;
    max-height: 52vh; overflow-y: auto; backdrop-filter: blur(4px);
  }
  #partsPanel.open { display: block; }
  .prow { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 8px; cursor: pointer; }
  .prow:hover { background: rgba(255,255,255,.07); }
  .prow.off { opacity: .4; }
  .pletter {
    width: 22px; height: 22px; border-radius: 50%; background: #b0622d; color: #fff;
    font-weight: 700; font-size: 12px; display: flex; align-items: center;
    justify-content: center; flex: none;
  }
  .pname { flex: 1; padding-right: 6px; }
  .pcount { color: #8f8f99; }
  #photo {
    position: fixed; inset: 0; background: rgba(0,0,0,.82); display: none;
    align-items: center; justify-content: center; z-index: 10; cursor: zoom-out;
  }
  #photo.open { display: flex; }
  #photo img { max-width: 92vw; max-height: 92vh; border-radius: 10px; }
  #cutplan {
    position: fixed; inset: 0; z-index: 9; display: none; overflow-y: auto;
    background: #17171c; color: #d6d6dd; font: 14px/1.5 system-ui, sans-serif;
    padding: 22px 28px 60px;
  }
  #cutplan.open { display: block; }
  #cutplan h2 { margin: 0 0 2px; color: #fff; }
  #cutplan .meta { color: #9a9aa4; margin-bottom: 14px; font-size: 13px; }
  #cutplan .stockCfg {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    margin: 8px 0 6px; font-size: 13px; color: #cfcfd6;
  }
  #cutplan .stockCfg input[type=number] {
    width: 4.4em; color: #fff; background: rgba(255,255,255,.08);
    border: 1px solid #3a3a44; border-radius: 6px; padding: 3px 6px; font: inherit;
  }
  #cutplan .stockCfg label { display: inline-flex; gap: 5px; align-items: center; margin-left: 14px; }
  #cutplan .planBtns { float: right; display: flex; gap: 8px; }
  #cutplan .planBtns button {
    color: #cfcfd6; background: rgba(255,255,255,.07); border: 1px solid #3a3a44;
    padding: 8px 14px; border-radius: 10px; cursor: pointer; font: inherit;
  }
  #cutplan .planTop { display: flex; gap: 28px; align-items: flex-start; flex-wrap: wrap; }
  #cutplan .planSnap { flex: 1 1 340px; min-width: 0; max-width: 620px; border-radius: 10px; background: #202027; }
  #cutplan table { border-collapse: collapse; margin: 10px 0 24px; }
  #cutplan th, #cutplan td {
    text-align: left; padding: 4px 16px 4px 0;
    border-bottom: 1px solid #2c2c33; font-size: 13px;
  }
  #cutplan th { color: #9a9aa4; font-weight: 600; }
  #cutplan td .pletter { display: inline-flex; margin-right: 8px; vertical-align: middle; }
  #cutplan .boardWrap { margin: 16px 0; }
  #cutplan .boardTitle { font-size: 13px; color: #9a9aa4; margin-bottom: 4px; }
  #cutplan svg { width: 100%; height: auto; background: #202027; border-radius: 6px; }
  @media print {
    html, body { overflow: visible !important; height: auto !important; background: #fff !important; }
    body > *:not(#cutplan) { display: none !important; }
    #cutplan { position: static; background: #fff; color: #111; padding: 0; overflow: visible; }
    #cutplan.open { display: block; }
    #cutplan h2 { color: #000; }
    #cutplan .meta, #cutplan .boardTitle, #cutplan th { color: #444; }
    #cutplan .planBtns { display: none; }
    #cutplan th, #cutplan td { border-bottom-color: #bbb; }
    #cutplan svg { background: #fff; border: 1px solid #999; border-radius: 0; }
    #cutplan .boardWrap { break-inside: avoid; }
    #cutplan .planSnap { width: 260px; }
    #cutplan .stockCfg { color: #444; }
    #cutplan .stockCfg input[type=number] { border: none; background: none; color: #111; padding: 0; width: 3em; }
    #cutplan .stockCfg label.adv { display: none; }
  }
  @media (max-width: 640px) {
    #hud { font-size: 11px; padding: 8px 10px; right: 16px; }
    #hud .hint { display: none; }
    #variants { display: none; }      /* buttons replaced by the dropdown */
    #variantSel { display: block; }
    #partsPanel { left: 12px; bottom: 100px; font-size: 12px; max-height: 40vh; }
    #views { bottom: 12px; font-size: 12px; }
    #views button { padding: 7px 10px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <b>Cherry Wood Hall Tree</b> — <span id="sizeLabel">84 × 43 × 179 cm</span><br>
  <span class="hint">Top shelf · clothes rail · drawer cabinet base<br>
  Drag — rotate &nbsp;·&nbsp; Scroll — zoom &nbsp;·&nbsp; Right-drag — pan</span>
</div>
<div id="variants"></div>
<select id="variantSel" aria-label="Model"></select>
<div id="views">
  <button data-view="threeQ">¾ view</button>
  <button data-view="front">Front</button>
  <button data-view="right">Right</button>
  <button data-view="back">Back</button>
  <button data-view="left">Left</button>
  <button data-view="top">Top</button>
  <button id="dimBtn">📏 Dimensions</button>
  <button id="partsBtn">🔠 Parts</button>
  <button id="planBtn">🪚 Cut plan</button>
  <button id="photoBtn">📷 Photo</button>
</div>
<div id="partsPanel"></div>
<div id="cutplan"></div>
<div id="photo"><img src="picture.jpeg" alt="Original product photo of the hall tree"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ============ dimensions from the product sheet (1 unit = 1 m) ============
// Width varies per model; every width-dependent part derives from wTop.
const H_TOTAL   = 1.79;   // total height 179cm
const D_TOP     = 0.25;   // top shelf depth 25cm
const SHELF_GAP = 0.105;  // shelf-to-rail 10.5cm
const D_BOTTOM  = 0.43;   // footprint depth 43cm
const DRAWER_H  = 0.18;   // each drawer row 18cm
const BASE_H    = 0.10;   // ground clearance 10cm
const BAR_H     = 0.10;   // mid crossbar board height 10cm

const CAB_TOP = BASE_H + DRAWER_H * 2 + 0.03;  // ≈0.49 — cabinet top surface

// The models on offer: original 80cm cabinet (84cm overall), wide 100cm,
// and one with an open cubby in place of the bottom drawer.
// Models are numbered (letters are reserved for the parts).
const MODELS = [
  { id: '1', name: 'Model 1 · 80cm',  wTop: 0.84 },
  { id: '2', name: 'Model 2 · 100cm', wTop: 1.04 },
  { id: '3', name: 'Model 3 · open base', wTop: 0.84, openBottom: true },
  { id: '4', name: 'Model 4 · open through', wTop: 0.84, openBottom: true, noBack: true },
  { id: '5', name: 'Model 5 · bottom shelf', wTop: 0.84, openBottom: true, noBack: true, noSides: true },
  { id: '6', name: 'Model 6 · slatted shelf', wTop: 0.84, openBottom: true, noBack: true, noSides: true, slatted: true },
  { id: '7', name: 'Model 7 · leg bar', wTop: 0.84, legBar: true },
  { id: '8', name: 'Model 8 · 100cm open + bar', wTop: 1.04, openBottom: true, noBack: true, legBar: true },
];

// ---------- renderer / scene / camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b1b20);
scene.fog = new THREE.Fog(0x1b1b20, 12, 26);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(2.6, 1.7, 3.4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.9, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 0.8;
controls.maxDistance = 10;
controls.maxPolarAngle = Math.PI * 0.52;

// ---------- lights ----------
scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x30281f, 0.5));

const key = new THREE.DirectionalLight(0xfff2e0, 1.7);
key.position.set(4, 6, 4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -3; key.shadow.camera.right = 3;
key.shadow.camera.top = 3;   key.shadow.camera.bottom = -3;
key.shadow.bias = -0.0004;
scene.add(key);

const fill = new THREE.DirectionalLight(0x9db8ff, 0.4);
fill.position.set(-5, 3, -4);
scene.add(fill);

// ---------- materials: cherry wood (樱桃木色) ----------
const cherry     = new THREE.MeshStandardMaterial({ color: 0xb0622d, roughness: 0.58, metalness: 0.02 });
const cherryDark = new THREE.MeshStandardMaterial({ color: 0x94491f, roughness: 0.62, metalness: 0.02 });
const cherryLite = new THREE.MeshStandardMaterial({ color: 0xc47a3e, roughness: 0.55, metalness: 0.02 });
const brass      = new THREE.MeshStandardMaterial({ color: 0xd9c391, roughness: 0.3,  metalness: 0.85 });
const chrome     = new THREE.MeshStandardMaterial({ color: 0xd4d7db, roughness: 0.22, metalness: 0.92 });
const floorMat   = new THREE.MeshStandardMaterial({ color: 0x2a2a30, roughness: 0.95 });

const dimMat = new THREE.LineBasicMaterial({
  color: 0xffcf8a, depthTest: false, transparent: true, opacity: 0.95,
});

// ---------- floor ----------
const floor = new THREE.Mesh(new THREE.CircleGeometry(9, 64), floorMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

function makeLabel(text) {
  const pad = 14, fh = 44;
  const c = document.createElement('canvas');
  let ctx = c.getContext('2d');
  ctx.font = `600 ${fh}px system-ui, sans-serif`;
  c.width = Math.ceil(ctx.measureText(text).width) + pad * 2;
  c.height = 62;
  ctx = c.getContext('2d');
  ctx.font = `600 ${fh}px system-ui, sans-serif`;
  ctx.fillStyle = 'rgba(12,12,16,0.78)';
  ctx.fillRect(0, 0, c.width, c.height);
  ctx.fillStyle = '#ffd9a0';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, c.width / 2, c.height / 2 + 2);
  const s = 0.0021;
  const label = new THREE.Mesh(
    new THREE.PlaneGeometry(c.width * s, c.height * s),
    new THREE.MeshBasicMaterial({
      map: new THREE.CanvasTexture(c), transparent: true, depthTest: false,
      toneMapped: false,
    }));
  label.renderOrder = 3;
  return label;
}

function makeChip(letter) {
  const c = document.createElement('canvas');
  c.width = c.height = 72;
  const ctx = c.getContext('2d');
  ctx.beginPath();
  ctx.arc(36, 36, 32, 0, Math.PI * 2);
  ctx.fillStyle = '#b0622d';
  ctx.fill();
  ctx.lineWidth = 5;
  ctx.strokeStyle = '#fff';
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = '700 38px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(letter, 36, 38);
  const chip = new THREE.Mesh(
    new THREE.PlaneGeometry(0.075, 0.075),
    new THREE.MeshBasicMaterial({
      map: new THREE.CanvasTexture(c), transparent: true, depthTest: false,
      toneMapped: false,
    }));
  chip.renderOrder = 4;
  return chip;
}

// ============ the hall tree, parameterized by overall width ============
function buildModel(wTop, opts = {}) {
  const unit = new THREE.Group();

  // parts registry: every mesh belongs to a named part; unique parts get
  // letters (A, B, C…) for the parts panel and, later, the cutting plan
  const parts = [];
  function part(name, grain) {
    // parts sharing a `grain` tag are cut consecutively from one beam so
    // the wood grain flows continuously across them (waterfall match)
    const p = { name, grain, meshes: [], chips: [], cuts: [], hidden: false };
    parts.push(p);
    return p;
  }
  // register a mesh under a part; cut = [dims in m] of the raw piece of
  // wood it is cut from (auto-derived for plain boxes)
  const reg = (p, m, cut) => {
    const g = m.geometry && m.geometry.parameters;
    if (!cut && g && g.width !== undefined) cut = [g.width, g.height, g.depth];
    if (cut) p.cuts.push(cut.map(v => Math.round(v * 200) / 2).sort((a, b) => b - a)); // cm in ½cm steps, L≥W≥T
    p.meshes.push(m);
    return m;
  };

  function box(w, h, d, mat, x, y, z, parent = unit) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    m.position.set(x, y, z);
    m.castShadow = m.receiveShadow = true;
    parent.add(m);
    return m;
  }

  // ---------- legs: right-triangle frame (三角結構) ----------
  // Side view: the BACK leg is a vertical flat plank running the FULL
  // 179cm — its top sticks up ABOVE the shelf. The slanted FRONT plank
  // rises from the front of the 43cm footprint toward the top.
  const LEG_X   = 0.035;                          // plank thickness (x)
  const BACK_D  = 0.07;                           // back leg depth (z)
  const FRONT_D = 0.055;                          // front leg depth (z)
  const SHELF_T = 0.03;
  const Z_BACK  = -(D_BOTTOM / 2 - BACK_D / 2);   // vertical back leg center
  const xLeg  = wTop / 2 - LEG_X / 2;

  const BACKRAIL_H = 0.075;                       // wooden back rail between leg tops
  const SHELF_TOP = H_TOTAL - 0.015 - BACKRAIL_H; // shelf sits ~9cm below leg tops
  const SHELF_BOT = SHELF_TOP - SHELF_T;

  // How the two planks join (from the product photos): the diagonal rises
  // PAST the shelf and dies into the back leg near its very top with a
  // PLUMB cut — both tops end level; a slim wedge of daylight opens below.
  const ZF = Z_BACK + BACK_D / 2;              // front plane of the back leg
  const DIAG_TOP = H_TOTAL;                    // diagonal top flush with the leg top
  const TOP_W = 0.035;                         // plank width remaining beside the leg top
  let tanT = (D_BOTTOM / 2 - FRONT_D - ZF - TOP_W) / DIAG_TOP;
  const wH  = FRONT_D / Math.cos(Math.atan(tanT));  // horizontal plank width
  const zr0 = D_BOTTOM / 2 - wH;               // rear bottom corner at the floor
  tanT = (zr0 + wH - ZF - TOP_W) / DIAG_TOP;
  const yPl = (zr0 - ZF) / tanT;               // plumb joint starts here (≈ shelf level)

  // side profile in (z, y); u = -z so the extrusion axis maps to world +x
  const prof = new THREE.Shape();
  prof.moveTo(-zr0, 0);                                 // rear bottom
  prof.lineTo(-(zr0 + wH), 0);                          // front bottom
  prof.lineTo(-(zr0 + wH - tanT * DIAG_TOP), DIAG_TOP); // front top, beside the leg top
  prof.lineTo(-ZF, DIAG_TOP);                           // horizontal top edge
  prof.lineTo(-ZF, yPl);                                // plumb face against the leg
  prof.closePath();
  const frontGeo = new THREE.ExtrudeGeometry(prof, { depth: LEG_X, bevelEnabled: false });

  const pFront = part('Front leg (diagonal)');
  const pBack  = part('Back leg');
  for (const sx of [-1, 1]) {
    // vertical back plank, full height
    const back = new THREE.Mesh(new THREE.BoxGeometry(LEG_X, H_TOTAL, BACK_D), cherry);
    back.position.set(sx * xLeg, H_TOTAL / 2, Z_BACK);
    back.castShadow = back.receiveShadow = true;
    unit.add(reg(pBack, back));

    // slanted front plank with mitered cuts
    const front = new THREE.Mesh(frontGeo, cherry);
    front.rotation.y = Math.PI / 2;
    front.position.x = sx * xLeg - LEG_X / 2;
    front.castShadow = front.receiveShadow = true;
    unit.add(reg(pFront, front,
      [DIAG_TOP / Math.cos(Math.atan(tanT)) + 0.02, FRONT_D, LEG_X]));
  }

  // ---------- top shelf ----------
  // Board sits BETWEEN the legs, back edge at the back legs, extending
  // 25cm forward past the leg fronts.
  const Z_SHELF = -D_BOTTOM / 2 + D_TOP / 2;
  reg(part('Top shelf'),
    box(wTop - 2 * LEG_X, SHELF_T, D_TOP, cherryLite, 0, SHELF_BOT + SHELF_T / 2, Z_SHELF));
  // wooden back rail spanning between the leg tops
  reg(part('Back rail'),
    box(wTop - 2 * LEG_X, BACKRAIL_H, 0.022, cherry, 0, SHELF_TOP + BACKRAIL_H / 2, Z_BACK - BACK_D / 2 + 0.011));

  // ---------- clothes rail, 10.5cm under the shelf ----------
  if (opts.legBar) {
    // Model G: simple round wooden bar spanning between the two front
    // diagonal planks, at the same height as the metal rail
    const railY = SHELF_BOT - SHELF_GAP;
    const zBar = zr0 - tanT * railY + wH / 2;   // diagonal plank center here
    const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.014, xLeg * 2, 20), cherryDark);
    bar.rotation.z = Math.PI / 2;
    bar.position.set(0, railY, zBar);
    bar.castShadow = true;
    unit.add(reg(part('Hanging bar (wood)'), bar, [xLeg * 2, 0.03, 0.03]));
  } else {
    // chrome tube bent into a wide U, ends curving up into the shelf
    const railY = SHELF_BOT - SHELF_GAP;
    const X0 = wTop / 2 - LEG_X - 0.06;
    const z = Z_SHELF;
    const pts = [
      new THREE.Vector3(-X0, SHELF_BOT + 0.005, z),
      new THREE.Vector3(-X0, railY + 0.05, z),
      new THREE.Vector3(-X0 + 0.010, railY + 0.014, z),
      new THREE.Vector3(-X0 + 0.05, railY, z),
      new THREE.Vector3(0, railY, z),
      new THREE.Vector3(X0 - 0.05, railY, z),
      new THREE.Vector3(X0 - 0.010, railY + 0.014, z),
      new THREE.Vector3(X0, railY + 0.05, z),
      new THREE.Vector3(X0, SHELF_BOT + 0.005, z),
    ];
    const rail = new THREE.Mesh(
      new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 96, 0.0085, 12), chrome);
    rail.castShadow = true;
    unit.add(rail);   // metal — excluded from the wood parts list
  }

  // ---------- mid crossbar: 10cm board between the back legs ----------
  const barY = CAB_TOP + 1.195 * 0.58;   // within the 119.5cm open section
  reg(part('Mid crossbar'),
    box(xLeg * 2, BAR_H, 0.02, cherry, 0, barY, Z_BACK - BACK_D / 2 + 0.01));

  // ---------- drawer cabinet: two 18cm rows on a 10cm base ----------
  const CAB_W = 2 * xLeg - LEG_X - 0.008;   // cabinet body fits BETWEEN the legs
  const CAB_D = D_BOTTOM - 0.01;
  const bodyH = DRAWER_H * 2 + 0.02;
  const rowY = r => BASE_H + 0.02 + DRAWER_H * r + DRAWER_H / 2;

  function pull(x, y, z) {   // metal — excluded from the wood parts list
    const p = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.014, 0.012), brass);
    p.position.set(x, y, z);
    p.castShadow = true;
    unit.add(p);
  }

  reg(part('Cabinet top board', 'wrap'),
    box(CAB_W + 0.006, 0.022, CAB_D + 0.02, cherryLite, 0, CAB_TOP - 0.011, 0));
  if (opts.slatted) {
    // Model F: slatted bottom shelf — narrow side-to-side slats carried
    // by a rectangular frame (side + front/back rails)
    const railW = 0.04, ySh = BASE_H + 0.015;
    const pRailS = part('Shelf frame rail (side)');
    const pRailF = part('Shelf frame rail (front/back)');
    const pSlat  = part('Shelf slat');
    for (const sx of [-1, 1])                     // side rails
      reg(pRailS, box(railW, 0.035, CAB_D, cherry, sx * (CAB_W - railW) / 2, ySh, 0));
    for (const sz of [-1, 1])                     // front and back rails
      reg(pRailF, box(CAB_W - railW * 2, 0.035, railW, cherry, 0, ySh, sz * (CAB_D - railW) / 2));
    const N = 6, z0 = -(CAB_D / 2 - railW - 0.035);
    for (let i = 0; i < N; i++)                   // slats, ends resting in the side rails
      reg(pSlat, box(CAB_W - railW, 0.024, 0.035, cherryDark, 0, ySh + 0.004, z0 + i * (-2 * z0) / (N - 1)));
  } else {
    reg(part(opts.openBottom ? 'Bottom shelf board' : 'Cabinet bottom board'),
      box(CAB_W, 0.03, CAB_D, cherryDark, 0, BASE_H + 0.015, 0));
  }

  const zFace = CAB_D / 2 + 0.008;
  if (opts.openBottom) {
    // bottom row is an open cubby: upper carcass carries the drawers,
    // below it a niche with side walls and a back panel, front open
    const yMid = BASE_H + 0.02 + DRAWER_H;     // ceiling of the cubby
    // drawer housing above the cubby: side panels, back panel, floor board.
    // When the cubby has sides they are ONE continuous panel with the
    // housing sides (full height); the floor board sits between them.
    const yTopB = CAB_TOP - 0.022;
    const houseHt = yTopB - yMid, houseMidY = (yMid + yTopB) / 2;
    const sideY0 = opts.noSides ? yMid : BASE_H + 0.03;   // full height unless Model 5/6
    const pSidePanel = part('Cabinet side panel', 'wrap');
    for (const sx of [-1, 1])
      reg(pSidePanel, box(0.018, yTopB - sideY0, CAB_D, cherry, sx * (CAB_W / 2 - 0.009), (sideY0 + yTopB) / 2, 0));
    reg(part('Cabinet back panel'),
      box(CAB_W - 0.036, houseHt, 0.014, cherryDark, 0, houseMidY, -CAB_D / 2 + 0.007));
    reg(part('Drawer floor board'),
      box(opts.noSides ? CAB_W : CAB_W - 0.036, 0.018, CAB_D, cherry, 0, yMid - 0.009, 0));
    if (!opts.noBack)  // Model 4: open all the way through, no back panel
      reg(part('Cubby back panel'),
        box(CAB_W - 0.036, DRAWER_H - 0.028, 0.014, cherryDark, 0, BASE_H + 0.03 + (DRAWER_H - 0.028) / 2, -CAB_D / 2 + 0.02));
  } else {
    // real construction between the bottom and top boards: two side
    // panels, a back panel, and a mid shelf separating the drawer rows
    const yBody0 = BASE_H + 0.03, yBody1 = CAB_TOP - 0.022;
    const bodyHt = yBody1 - yBody0, bodyMidY = (yBody0 + yBody1) / 2;
    const pSidePanel = part('Cabinet side panel', 'wrap');
    for (const sx of [-1, 1])
      reg(pSidePanel, box(0.018, bodyHt, CAB_D, cherry, sx * (CAB_W / 2 - 0.009), bodyMidY, 0));
    reg(part('Cabinet back panel'),
      box(CAB_W - 0.036, bodyHt, 0.014, cherryDark, 0, bodyMidY, -CAB_D / 2 + 0.007));
    reg(part('Drawer mid shelf'),
      box(CAB_W - 0.036, 0.018, CAB_D - 0.034, cherry, 0, BASE_H + 0.02 + DRAWER_H, -0.003));
    // bottom row: single full-width drawer
    reg(part('Drawer front (wide)'),
      box(CAB_W - 0.025, DRAWER_H - 0.015, 0.018, cherryLite, 0, rowY(0), zFace));
    pull(0, rowY(0) + DRAWER_H / 2 - 0.035, zFace + 0.014);
  }
  // top row: two half-width drawers with a divider between them
  const pDrawerH = part('Drawer front (half)');
  for (const sx of [-1, 1]) {
    reg(pDrawerH, box(CAB_W / 2 - 0.015, DRAWER_H - 0.015, 0.018, cherryLite, sx * CAB_W / 4, rowY(1), zFace));
    pull(sx * CAB_W / 4, rowY(1) + DRAWER_H / 2 - 0.035, zFace + 0.014);
  }
  reg(part('Drawer divider'),
    box(0.012, DRAWER_H - 0.01, 0.02, cherryDark, 0, rowY(1), zFace - 0.004));

  // ---------- dimension overlay (sheet measurements, sticky labels) ----------
  const dims = new THREE.Group();
  unit.add(dims);

  function dim(a, b, text, labelOff = [0, 0, 0]) {
    a = new THREE.Vector3(...a);
    b = new THREE.Vector3(...b);
    const dir = b.clone().sub(a).normalize();
    const ref = Math.abs(dir.y) > 0.9 ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0);
    const perp = new THREE.Vector3().crossVectors(dir, ref).normalize().multiplyScalar(0.018);
    const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([a, b]), dimMat);
    line.renderOrder = 2;
    dims.add(line);
    for (const p of [a, b]) {   // end ticks
      const t = new THREE.Line(new THREE.BufferGeometry().setFromPoints(
        [p.clone().add(perp), p.clone().sub(perp)]), dimMat);
      t.renderOrder = 2;
      dims.add(t);
    }
    const label = makeLabel(text);
    label.position.copy(a.add(b).multiplyScalar(0.5)).add(new THREE.Vector3(...labelOff));
    if (Math.abs(dir.z) > 0.9) label.rotation.y = Math.PI / 2;  // depth dims face sideways
    const back = label.clone();          // mirror copy so text reads from both sides
    back.rotation.y += Math.PI;
    label.translateZ(0.001);
    back.translateZ(0.001);
    dims.add(label, back);
  }

  const topCm = Math.round(wTop * 100);        // 84 / 104
  const cabCm = topCm - 4;                     // sheet cabinet width: 80 / 100
  const xSide = CAB_W / 2 + 0.09;              // vertical dims beside the cabinet

  dim([-wTop / 2, 1.88, Z_SHELF], [wTop / 2, 1.88, Z_SHELF], `${topCm}cm`, [0, 0.05, 0]);
  dim([xLeg + 0.15, 1.83, -D_BOTTOM / 2], [xLeg + 0.15, 1.83, -D_BOTTOM / 2 + D_TOP], '25cm', [0.09, 0.03, 0]);
  dim([-0.28, SHELF_BOT, Z_SHELF + 0.1], [-0.28, SHELF_BOT - SHELF_GAP, Z_SHELF + 0.1], '10.5cm', [-0.13, 0, 0]);
  dim([-(xLeg + 0.22), 0, 0.05], [-(xLeg + 0.22), H_TOTAL, 0.05], '179cm', [-0.12, 0, 0]);
  dim([xLeg + 0.20, CAB_TOP, 0.08], [xLeg + 0.20, CAB_TOP + 1.195, 0.08], '119.5cm', [0.14, 0, 0]);
  dim([0.12, barY - BAR_H / 2, -0.16], [0.12, barY + BAR_H / 2, -0.16], '10cm', [0.12, 0, 0]);
  dim([-CAB_W / 2, rowY(1), 0.26], [0, rowY(1), 0.26], `${cabCm / 2}cm`, [0, 0.045, 0]);
  dim([xSide, rowY(1) - DRAWER_H / 2, 0.20], [xSide, rowY(1) + DRAWER_H / 2, 0.20], '18cm', [0.11, 0, 0]);
  dim([xSide, rowY(0) - DRAWER_H / 2, 0.20], [xSide, rowY(0) + DRAWER_H / 2, 0.20], '18cm', [0.11, 0, 0]);
  dim([xSide, 0, 0.20], [xSide, BASE_H, 0.20], '10cm', [0.11, 0, 0]);
  dim([-CAB_W / 2, 0.045, 0.26], [CAB_W / 2, 0.045, 0.26], `${cabCm}cm`, [0, -0.055, 0]);
  dim([-(xLeg + 0.15), 0.03, -D_BOTTOM / 2], [-(xLeg + 0.15), 0.03, D_BOTTOM / 2], '43cm', [-0.10, -0.03, 0]);

  // ---------- part letters + 3D letter badges ----------
  unit.updateMatrixWorld(true);
  const chips = new THREE.Group();
  chips.visible = false;
  parts.forEach((p, i) => {
    p.letter = String.fromCharCode(65 + i);   // A, B, C…
    for (const mesh of p.meshes) {
      const chip = makeChip(p.letter);
      chip.position.copy(new THREE.Box3().setFromObject(mesh).getCenter(new THREE.Vector3()));
      const rear = chip.clone();          // mirrored copy so it reads from behind
      rear.rotation.y = Math.PI;
      p.chips.push(chip, rear);
      chips.add(chip, rear);
    }
  });
  unit.add(chips);

  unit.userData.dims = dims;
  unit.userData.parts = parts;
  unit.userData.chips = chips;
  return unit;
}

// ---------- build all models, wire the variant switcher ----------
const variantsEl = document.getElementById('variants');
const variantSel = document.getElementById('variantSel');
const sizeLabel = document.getElementById('sizeLabel');
for (const m of MODELS) {
  m.unit = buildModel(m.wTop, m);
  m.unit.visible = false;
  scene.add(m.unit);
  m.btn = document.createElement('button');
  m.btn.textContent = m.name;
  m.btn.onclick = () => setModel(m.id);
  variantsEl.appendChild(m.btn);
  const opt = document.createElement('option');
  opt.value = m.id;
  opt.textContent = m.name;
  variantSel.appendChild(opt);
}
variantSel.onchange = () => setModel(variantSel.value);

let dimsOn = false;
function setModel(id) {
  for (const m of MODELS) {
    m.unit.visible = m.id === id;
    m.btn.classList.toggle('on', m.id === id);
    if (m.id === id) sizeLabel.textContent = `${Math.round(m.wTop * 100)} × 43 × 179 cm`;
  }
  variantSel.value = id;
  renderPartsPanel();
  if (typeof planOn !== 'undefined' && planOn) renderPlan();
}

// ---------- parts panel: letters, counts, per-part show/hide ----------
const partsPanel = document.getElementById('partsPanel');
const partsBtn = document.getElementById('partsBtn');
let partsOn = false;

function renderPartsPanel() {
  const active = MODELS.find(m => m.unit.visible);
  partsPanel.innerHTML = '';
  if (!active) return;
  for (const p of active.unit.userData.parts) {
    const row = document.createElement('div');
    row.className = 'prow' + (p.hidden ? ' off' : '');
    row.innerHTML = `<span class="pletter">${p.letter}</span>` +
      `<span class="pname">${p.name}</span><span class="pcount">×${p.meshes.length}</span>`;
    row.onclick = () => {
      p.hidden = !p.hidden;
      for (const mesh of p.meshes) mesh.visible = !p.hidden;
      for (const chip of p.chips) chip.visible = !p.hidden;
      row.classList.toggle('off', p.hidden);
    };
    partsPanel.appendChild(row);
  }
}

function setParts(on) {
  partsOn = on;
  for (const m of MODELS) m.unit.userData.chips.visible = on;
  partsPanel.classList.toggle('open', on);
  partsBtn.classList.toggle('on', on);
}
partsBtn.onclick = () => setParts(!partsOn);

// ---------- dimensions toggle ----------
const dimBtn = document.getElementById('dimBtn');
function setDims(on) {
  dimsOn = on;
  for (const m of MODELS) m.unit.userData.dims.visible = on;
  dimBtn.classList.toggle('on', on);
}
dimBtn.onclick = () => setDims(!dimsOn);

const params = new URLSearchParams(location.search);
// accept legacy letter ids (?model=b) by mapping a-g onto 1-7
const rawModel = (params.get('model') || '').toLowerCase();
const wanted = /^[a-g]$/.test(rawModel) ? String(rawModel.charCodeAt(0) - 96) : rawModel;
setModel(MODELS.some(m => m.id === wanted) ? wanted : '1');
setDims(params.get('dims') === '1');
setParts(params.get('parts') === '1');

// ---------- cutting plan: nest all wood parts onto stock boards ----------
// the beams you buy, cm — editable in the plan UI; W2 is the optional
// second width for mixed-width buying (advanced mode)
const STOCK = { L: 310, W: 20, W2: null, T: 2.5, kerf: 0.4 };
const stockWidths = () => (STOCK.W2 ? [STOCK.W, STOCK.W2] : [STOCK.W]);
const planEl = document.getElementById('cutplan');
const planBtn = document.getElementById('planBtn');
var planOn = false;   // var: setModel may run before this line executes

const fmt = v => (Math.abs(v - Math.round(v)) < 0.05 ? String(Math.round(v)) : v.toFixed(1));
const colorFor = letter => `hsl(${(letter.charCodeAt(0) - 65) * 47 % 360} 55% 55%)`;

// pieces thicker than the stock become glue-up layers; wider than the
// stock become edge-glued strips — every rectangle then fits the board
function expandParts(model) {
  const rows = [], rects = [];
  const widths = stockWidths();
  for (const p of model.unit.userData.parts) {
    if (!p.cuts.length) continue;
    const [L, W, T] = p.cuts[0];
    const qty = p.cuts.length;
    const layers = Math.max(1, Math.ceil(T / STOCK.T - 1e-6));
    // pick the stock width needing the fewest strips (tie → narrower beam)
    const pick = widths
      .map(sw => ({ sw, strips: Math.max(1, Math.ceil(W / sw - 1e-6)) }))
      .sort((a, b) => a.strips - b.strips || a.sw - b.sw)[0];
    const notes = [];
    if (layers > 1) notes.push(`${fmt(T)}cm thick → ${layers}-layer glue-up`);
    if (pick.strips > 1) notes.push(`${fmt(W)}cm wide → ${pick.strips} strips edge-glued`);
    if (widths.length > 1) notes.push(`${fmt(pick.sw)}cm beam`);
    if (p.grain) notes.push('↔ continuous grain run');
    if (L > STOCK.L) notes.push(`⚠ longer than the beam (${fmt(STOCK.L)}cm)`);
    rows.push({ p, L, W, T, qty, notes });
    for (let q = 0; q < qty * layers * pick.strips; q++)
      rects.push({ letter: p.letter, L, w: W / pick.strips, sw: pick.sw, grain: p.grain });
  }
  return { rows, rects };
}

// greedy column packing: pieces sorted by length fill 20cm-wide columns
// along the board, a saw kerf between every neighbouring cut
function packBoards(rects) {
  const boards = [];
  const placeable = rects.filter(r => r.L <= STOCK.L);

  // grain runs first: pieces of a run go consecutively along one beam,
  // ordered side · back · side so the grain wraps around the cabinet
  const runs = new Map();
  for (const r of placeable) {
    if (!r.grain) continue;
    const k = r.grain + '|' + r.sw;
    if (!runs.has(k)) runs.set(k, []);
    runs.get(k).push(r);
  }
  for (const group of runs.values()) {
    // round-robin across the parts (side, top, side, top…) so every
    // neighbouring pair on the beam is a grain-matched joint
    const letterGroups = [...new Set(group.map(r => r.letter))]
      .map(l => group.filter(r => r.letter === l))
      .sort((a, b) => b.length - a.length);
    const seq = [];
    for (let i = 0; letterGroups.some(g => i < g.length); i++)
      for (const g of letterGroups) if (i < g.length) seq.push(g[i]);

    let b = null, runStart = 0, runW = 0;
    const closeRun = () => { if (b) b.grainRuns.push({ from: runStart, to: b.cursor - STOCK.kerf, w: runW }); };
    for (const r of seq) {
      if (!b || b.cursor + r.L > STOCK.L) {
        closeRun();
        b = { sw: r.sw, cursor: 0, columns: [], grainRuns: [] };
        boards.push(b);
        runStart = 0;
        runW = 0;
      }
      b.columns.push({ x: b.cursor, len: r.L, used: r.w + STOCK.kerf,
                       pieces: [{ ...r, x: b.cursor, y: 0 }] });
      b.cursor += r.L + STOCK.kerf;
      runW = Math.max(runW, r.w);
    }
    closeRun();
  }

  const sorted = placeable.filter(r => !r.grain).sort((a, b) => b.L - a.L);
  for (const r of sorted) {
    let placed = false;
    for (const b of boards) {
      if (b.sw !== r.sw) continue;   // beams of a given width take their own pieces
      for (const col of b.columns) {
        if (r.L <= col.len && col.used + r.w <= b.sw + 1e-6) {
          col.pieces.push({ ...r, x: col.x, y: col.used });
          col.used += r.w + STOCK.kerf;
          placed = true;
          break;
        }
      }
      if (placed) break;
      if (b.cursor + r.L <= STOCK.L) {
        b.columns.push({ x: b.cursor, len: r.L, used: r.w + STOCK.kerf,
                         pieces: [{ ...r, x: b.cursor, y: 0 }] });
        b.cursor += r.L + STOCK.kerf;
        placed = true;
        break;
      }
    }
    if (!placed) {
      boards.push({ sw: r.sw, cursor: r.L + STOCK.kerf, grainRuns: [],
        columns: [{ x: 0, len: r.L, used: r.w + STOCK.kerf, pieces: [{ ...r, x: 0, y: 0 }] }] });
    }
  }
  return boards;
}

// off-screen snapshot of the model with part letters visible, for the plan
function modelSnapshot(model) {
  const W = 720, H = 960;
  const cam = new THREE.PerspectiveCamera(45, W / H, 0.1, 100);
  cam.position.set(1.7, 1.35, 2.3);
  cam.lookAt(0, 0.92, 0);
  const chips = model.unit.userData.chips;
  const prevChips = chips.visible;
  chips.visible = true;
  renderer.setSize(W, H, false);
  renderer.render(scene, cam);
  const url = renderer.domElement.toDataURL('image/png');
  chips.visible = prevChips;
  renderer.setSize(innerWidth, innerHeight, false);
  return url;
}

function renderPlan() {
  const model = MODELS.find(m => m.unit.visible);
  const { rows, rects } = expandParts(model);
  const boards = packBoards(rects);
  const usedArea = rects.filter(r => r.L <= STOCK.L).reduce((s, r) => s + r.L * r.w, 0);
  const boughtArea = boards.reduce((s, b) => s + STOCK.L * b.sw, 0);
  const waste = boughtArea ? 100 * (1 - usedArea / boughtArea) : 0;

  const buy = stockWidths()
    .map(sw => ({ sw, n: boards.filter(b => b.sw === sw).length }))
    .filter(g => g.n)
    .map(g => `<b>${g.n} × (${fmt(STOCK.L)} × ${fmt(g.sw)} × ${fmt(STOCK.T)} cm)</b>`)
    .join(' + ') || '<b>nothing fits</b>';
  const tooLong = rects.filter(r => r.L > STOCK.L).length;

  let h = `<div class="planBtns">
      <button onclick="print()">🖨 Print</button>
      <button id="planClose">✕ Close</button></div>
    <h2>Cutting plan — ${model.name}</h2>
    <div class="stockCfg">Stock beam:
      <input id="stL" type="number" step="5" min="30" value="${STOCK.L}"> ×
      <input id="stW" type="number" step="0.5" min="3" value="${STOCK.W}"> ×
      <input id="stT" type="number" step="0.5" min="0.5" value="${STOCK.T}"> cm
      <label class="adv"><input id="stAdv" type="checkbox" ${STOCK.W2 ? 'checked' : ''}> mixed widths</label>
      ${STOCK.W2 ? `<span>second width: <input id="stW2" type="number" step="0.5" min="3" value="${STOCK.W2}"> cm</span>` : ''}
    </div>
    <div class="meta">Buy ${buy} · saw kerf ${STOCK.kerf * 10} mm · offcut ${waste.toFixed(0)}%` +
    (tooLong ? ` · <span style="color:#e88">⚠ ${tooLong} piece(s) longer than the beam — increase the length</span>` : '') +
    `</div>`;

  h += `<div class="planTop"><table><tr><th>Part</th><th>Cut size (cm)</th><th>Qty</th><th>Notes</th></tr>`;
  for (const r of rows) {
    h += `<tr><td><span class="pletter" style="background:${colorFor(r.p.letter)}">${r.p.letter}</span>${r.p.name}</td>` +
      `<td>${fmt(r.L)} × ${fmt(r.W)} × ${fmt(r.T)}</td><td>×${r.qty}</td><td>${r.notes.join(' · ')}</td></tr>`;
  }
  h += `</table><img class="planSnap" alt="Model with lettered parts" src="${modelSnapshot(model)}"></div>`;

  boards.forEach((b, i) => {
    let svg = `<svg viewBox="-1 -1 ${STOCK.L + 2} ${b.sw + 2}">` +
      `<rect x="0" y="0" width="${STOCK.L}" height="${b.sw}" fill="none" stroke="#777" stroke-width="0.4"/>`;
    let area = 0;
    for (const col of b.columns) {
      for (const pc of col.pieces) {
        area += pc.L * pc.w;
        svg += `<rect x="${pc.x}" y="${pc.y}" width="${pc.L}" height="${pc.w}" ` +
          `fill="${colorFor(pc.letter)}" fill-opacity="0.75" stroke="#111" stroke-width="0.3"/>`;
        const fs = Math.min(6, pc.w * 0.75);
        if (fs > 1.6) {
          svg += `<text x="${pc.x + pc.L / 2}" y="${pc.y + pc.w / 2}" font-size="${fs}" ` +
            `fill="#fff" text-anchor="middle" dominant-baseline="central">` +
            `${pc.letter}${pc.L > 24 && fs > 2.6 ? ` · ${fmt(pc.L)}×${fmt(pc.w)}` : ''}</text>`;
        }
      }
    }
    for (const run of b.grainRuns || []) {   // mark grain-matched runs
      const y = run.w + 1.1;
      svg += `<line x1="${run.from}" y1="${y}" x2="${run.to}" y2="${y}" ` +
        `stroke="#ffd9a0" stroke-width="0.45" stroke-dasharray="2.5 1.3"/>` +
        `<text x="${(run.from + run.to) / 2}" y="${y + 2.4}" font-size="2.3" ` +
        `fill="#ffd9a0" text-anchor="middle">→ continuous grain — keep this order →</text>`;
    }
    svg += `</svg>`;
    h += `<div class="boardWrap"><div class="boardTitle">Beam ${i + 1} of ${boards.length}` +
      `${stockWidths().length > 1 ? ` · ${fmt(b.sw)}cm wide` : ''} — ` +
      `${(100 * area / (STOCK.L * b.sw)).toFixed(0)}% used</div>${svg}</div>`;
  });

  planEl.innerHTML = h;
  document.getElementById('planClose').onclick = () => setPlan(false);

  // stock size inputs re-plan on change
  const bind = (id, apply) => {
    const el = document.getElementById(id);
    if (el) el.onchange = () => { apply(el); renderPlan(); };
  };
  bind('stL', el => { STOCK.L = Math.max(30, +el.value || 310); });
  bind('stW', el => { STOCK.W = Math.max(3, +el.value || 20); });
  bind('stT', el => { STOCK.T = Math.max(0.5, +el.value || 2.5); });
  bind('stW2', el => { STOCK.W2 = Math.max(3, +el.value || 14); });
  bind('stAdv', el => { STOCK.W2 = el.checked ? (STOCK.W2 || 14) : null; });
}

function setPlan(on) {
  planOn = on;
  if (on) renderPlan();
  planEl.classList.toggle('open', on);
  planBtn.classList.toggle('on', on);
}
planBtn.onclick = () => setPlan(!planOn);
setPlan(new URLSearchParams(location.search).get('plan') === '1');

// ---------- camera view presets ----------
const VIEWS = {
  threeQ: [2.6, 1.7, 3.4],
  front:  [0, 1.1, 4.1],
  right:  [4.1, 1.1, 0],
  back:   [0, 1.1, -4.1],
  left:   [-4.1, 1.1, 0],
  top:    [0, 5.0, 0.7],
};
let camTween = null;
for (const b of document.querySelectorAll('#views button[data-view]')) {
  b.onclick = () => {
    camTween = { from: camera.position.clone(), to: new THREE.Vector3(...VIEWS[b.dataset.view]), t: 0 };
  };
}

// ---------- reference photo overlay ----------
const photo = document.getElementById('photo');
document.getElementById('photoBtn').onclick = () => photo.classList.add('open');
photo.onclick = () => photo.classList.remove('open');

// ---------- render loop ----------
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  if (camTween) {
    camTween.t = Math.min(1, camTween.t + clock.getDelta() / 0.6);
    const k = camTween.t * camTween.t * (3 - 2 * camTween.t);  // smoothstep ease
    camera.position.lerpVectors(camTween.from, camTween.to, k);
    if (camTween.t >= 1) camTween = null;
  } else {
    clock.getDelta();
  }
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
